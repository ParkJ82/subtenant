# Optional continuous deployment: push to Vercel from the Actions tab.
# Repository secrets (Settings → Secrets and variables): VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# Copy ids from the Vercel project (Settings → General) and create a token under Account Settings → Tokens.
# Configure DB_*, JWT_SECRET in the Vercel project Environment Variables; they are not set by this workflow.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      production:
        description: "Use Vercel production (alias + --prod)"
        type: boolean
        default: true

jobs:
  vercel:
    name: Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25.2.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: ${{ github.event.inputs.production == 'true' && '--prod' || '' }}
