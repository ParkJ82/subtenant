# Continuous integration: install deps and verify a production build on every push and PR.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Placeholder values so mysql pool / JWT load during build; no DB connection is made.
  DB_HOST: 127.0.0.1
  DB_PORT: "3306"
  DB_USER: ci
  DB_PASSWORD: ci
  DB_NAME: ci
  JWT_SECRET: ci-jwt-secret-for-github-actions
  # Do not set NODE_ENV=production here: npm ci would skip devDependencies and the
  # build needs @tailwindcss/postcss, tailwindcss, typescript, etc.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
